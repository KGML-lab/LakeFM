  monitor: val_loss
  mode: min
  save_top_k: 1
  last_filename: last_ckpt.pth
  save_last: true
  ckpt_filename: ckpt_epoch{}.pth
  save_freq: 5
  accum_iter: 4
  max_epochs: 50
  inverse: false
  use_gradient_clipping: true
  gradient_clip_val: 1.0
