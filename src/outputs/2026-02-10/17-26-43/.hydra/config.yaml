  lake_ids_format: list
model:
  _target_: lakefm.model.LakeFMModule
  model_name: lakefm
  d_model: 128
  num_layers: 12
  n_heads: 4
  var_embed_dim: 64
  depth_embed_dim: 32
  inp_embed_dim: 64
  time_embed_dim: 16
  static_dim: 32
  temporal_dim: 96
  output_attention: false
  factor: 1
  dropout_p: 0.0
  head_dropout: 0.02
  d_ff: 2048
  attn_dropout_p: 0.0
  activation: swiglu
  revin: false
  tokenization: scalar
  patch_size: 3
  max_vars: 24
  pad_token: 0
  max_seq_len: 3076
  max_pred_len: 588
  seq_len: ${seq_len}
  pred_len: ${pred_len}
  add_or_concat: concat
  additional_forecast_layer: true
  num_bands: 6
  max_resolution: 1.0
  include_input: true
  use_rope: true
  cl_proj_type: attention_pooling
  cl_proj_dim: 64
  use_time_embed: true
  use_pre_norm: true
  variate_wise_df: true
  shared_variate_embedding_for_df: true
  stop_grad_on_shared_var_embed_for_df: true
  num_warmup_steps: 10000
tf32: true
task_name: evaluate
seed: 2025
trial: 0
output_path: ''
window:
  dynamic_windows: false
  window_pairs:
  - - 14
    - 14
  - - 21
    - 14
  - - 30
    - 14
  - - 30
    - 21
  - - 30
    - 30
  window_sampling_strategy: cycle
seq_len: 30
pred_len: 14
eval_freq: 1
plot_lake_id: 1
plot_freq: 5
num_plot_batches: -1
plot_num_samples: 1
plot_merged: true
forecast_plot_type: line
context_plot_type: line
plot_interval: true
regular_grid_forecasting: false
regular_grid_depths: 12
regular_grid_max_depth: null
enable_heatmap_plotting: true
plot_both_heatmap_types: true
eval_time_grid: regular
lake_embed_traj: false
feature_wise_mse: true
run_name: test
project_name: lakefm_eval
server_prefix: ../resources
PAD_VAL_DEFAULT: 0
PAD_VAL_ID: 0
mask_variable: null
mask_depth: null
mask_var_across_depths: false
mask_depth_across_variables: false
