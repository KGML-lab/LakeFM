  beta1: 0.9
  beta2: 0.98
  use_lr_scheduler: true
  warmup_epochs: null
  optimization_mode: batch
  resume_checkpoint: null
  pretrain_ckpts_dir: /${server_prefix}/lakefm/dev/pretrain_ckpts
