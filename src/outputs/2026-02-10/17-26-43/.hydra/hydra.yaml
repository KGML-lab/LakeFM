hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - task_name=evaluate
    - project_name=lakefm_eval
    - run_name=test
    - server_prefix=../resources
    - evaluator.eval_dataset=LakeBeD
    - model.add_or_concat=concat
    - evaluator.ckpt_path=../resources/lakefm/dev/pretrain_ckpts/lakefm5m.pth
    - evaluator.ckpt_name=lakefm5m
    - evaluator.num_trials=1
    - evaluator.output_dir=../resources/lakefm/dev/evaluations/lakefm5m/LakeBeD
    - dataloader.batch_size=32
    - dataloader.shuffle=False
    - data.use_global_lake_filter=true
    - data.lake_ids=["AL"]
    - data.lake_ids_format=list
    - model.revin=False
    - data.ds_plot_id=0
    - dataloader.sharding_mode=ddp
    - plot_merged=True
    - plot_interval=True
    - num_plot_batches=-1
    - forecast_plot_type=line
    - model.variate_wise_df=true
    - model.shared_variate_embedding_for_df=true
    - model.num_layers=12
    - evaluator.denorm_eval=False
    - plotter.var_names_subset=null
    - mask_variable=null
    - mask_depth=null
    - mask_var_across_depths=false
    - mask_depth_across_variables=false
    - evaluator.plot=False
    - dataloader.num_workers=12
  job:
    name: main
    chdir: null
    override_dirname: data.ds_plot_id=0,data.lake_ids=["AL"],data.lake_ids_format=list,data.use_global_lake_filter=true,dataloader.batch_size=32,dataloader.num_workers=12,dataloader.sharding_mode=ddp,dataloader.shuffle=False,evaluator.ckpt_name=lakefm5m,evaluator.ckpt_path=../resources/lakefm/dev/pretrain_ckpts/lakefm5m.pth,evaluator.denorm_eval=False,evaluator.eval_dataset=LakeBeD,evaluator.num_trials=1,evaluator.output_dir=../resources/lakefm/dev/evaluations/lakefm5m/LakeBeD,evaluator.plot=False,forecast_plot_type=line,mask_depth=null,mask_depth_across_variables=false,mask_var_across_depths=false,mask_variable=null,model.add_or_concat=concat,model.num_layers=12,model.revin=False,model.shared_variate_embedding_for_df=true,model.variate_wise_df=true,num_plot_batches=-1,plot_interval=True,plot_merged=True,plotter.var_names_subset=null,project_name=lakefm_eval,run_name=test,server_prefix=../resources,task_name=evaluate
    id: ???
    num: ???
    config_name: default.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/abhilash22/LakeFM/src
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/abhilash22/LakeFM/src/cli/conf/pretrain
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/abhilash22/LakeFM/src/outputs/2026-02-10/17-26-43
    choices:
      model: base_model
      data: base
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
